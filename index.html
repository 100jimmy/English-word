<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabMaster - 雲端同步單字庫</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #e0e7ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --warning: #f59e0b;
      --success: #10b981;
      --border: #cbd5e1;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      color: white; padding: 1.2rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
    }
    header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }

    .container { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 1.5rem; }
    
    .nav-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: #e2e8f0; padding: 0.3rem; border-radius: var(--radius); }
    .nav-btn { flex: 1; border: none; background: transparent; padding: 0.75rem 1rem; border-radius: 8px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .nav-btn.active { background: white; color: var(--primary); box-shadow: var(--shadow); }

    .btn { 
      background-color: var(--primary); 
      color: #ffffff !important; 
      border: none; 
      padding: 0.8rem 1.5rem; 
      border-radius: var(--radius); 
      font-weight: 600; 
      font-size: 1rem;
      cursor: pointer; 
      transition: all 0.2s; 
      display: inline-block;
      text-align: center;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: #f1f5f9; color: var(--text-main) !important; }
    .btn-danger { background-color: var(--danger); color: white !important; }

    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }
    input, select, textarea { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 1rem; background-color: #fff; }

    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.2rem; }
    .word-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem; position: relative; }
    .word-card.error-marked { border-left: 4px solid var(--danger); }

    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .badge-pos { background: var(--primary-light); color: var(--primary); }
    .badge-error { background: var(--danger-light); color: var(--danger); }

    .quiz-container { text-align: center; }
    .quiz-type-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .type-card { border: 2px solid var(--border); border-radius: var(--radius); padding: 1.2rem; cursor: pointer; }
    .type-card.selected { border-color: var(--primary); background: var(--primary-light); }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
    .option-btn { padding: 1.2rem; font-size: 1.05rem; background: #f8fafc; border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; text-align: left; }

    .hidden { display: none !important; }
    .sync-status { font-size: 0.85rem; color: #a5b4fc; font-weight: 500; margin-left: 1rem; }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center;">
      <h1>✨ VocabMaster</h1>
      <span id="sync-indicator" class="sync-status"></span>
    </div>
    <div id="user-info">
      <span id="current-user-display" style="margin-right: 1rem; font-weight: 500;">未登入</span>
      <button class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="logout()">切換帳號</button>
    </div>
  </header>

  <div class="container">
    <!-- 登入區塊 -->
    <div id="auth-section" class="card">
      <h2 style="margin-top:0;">☁️ 歡迎使用雲端單字庫試1</h2>
      <p style="color: var(--text-muted);">輸入名字即可自動從 Google 雲端載入您的專屬單字：</p>
      <div class="form-group">
        <input type="text" id="username-input" placeholder="例如: Alex" />
      </div>
      <button class="btn" style="width: 100%; margin-top: 0.5rem;" onclick="login()">🚀 載入雲端單字庫</button>
    </div>

    <!-- 主導覽列 -->
    <div id="app-nav" class="nav-bar hidden">
      <button class="nav-btn active" onclick="switchTab('list')">📖 單字總覽</button>
      <button class="nav-btn" onclick="switchTab('add')">➕ 新增單字</button>
      <button class="nav-btn" onclick="switchTab('quiz')">✍️ 測驗模式</button>
    </div>

    <!-- 1. 單字列表 -->
    <div id="list-tab" class="tab-content hidden">
      <div class="card">
        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
          <input type="text" id="search-input" placeholder="🔍 搜尋單字、解釋..." oninput="renderWordList()">
          <select id="filter-select" onchange="renderWordList()" style="width: 180px;">
            <option value="all">顯示全部</option>
            <option value="error">僅顯示易錯單字</option>
          </select>
        </div>
        <div id="word-list" class="word-grid"></div>
      </div>
    </div>

    <!-- 2. 新增單字 -->
    <div id="add-tab" class="tab-content hidden">
      <div class="card">
        <h2 style="margin-top:0;">➕ 新增英文單字 (即時同步雲端)</h2>
        <form id="add-word-form" onsubmit="addWord(event)">
          <div class="form-group">
            <label>英文單字</label>
            <div style="display: flex; gap: 0.5rem;">
              <input type="text" id="word-spelling" required placeholder="例如: persistent" style="flex: 1;">
              <button type="button" class="btn btn-secondary" style="white-space: nowrap; padding: 0.8rem 1rem;" onclick="autoFetchDetails()">
                ⚡ 自動帶入
              </button>
            </div>
            <small id="auto-fetch-msg" style="color: var(--text-muted); font-size: 0.8rem; margin-top: 0.3rem; display: block;"></small>
          </div>
          <div class="form-group">
            <label>詞性</label>
            <select id="word-pos">
              <option value="n.">n. 名詞</option>
              <option value="v.">v. 動詞</option>
              <option value="adj.">adj. 形容詞</option>
              <option value="adv.">adv. 副詞</option>
              <option value="prep.">prep. 介系詞</option>
              <option value="conj.">conj. 連接詞</option>
              <option value="phr.">phr. 片語</option>
            </select>
          </div>
          <div class="form-group">
            <label>中文解釋</label>
            <input type="text" id="word-meaning" required placeholder="例如: 堅持不懈的">
          </div>
          <div class="form-group">
            <label>英文例句 (可選)</label>
            <textarea id="word-sentence" rows="2" placeholder="例如: She is persistent in pursuing her goal."></textarea>
          </div>
          <button type="submit" class="btn" style="width: 100%;">儲存並同步至雲端</button>
        </form>
      </div>
    </div>

    <!-- 3. 測驗頁面 -->
    <div id="quiz-tab" class="tab-content hidden">
      <div class="card quiz-container" id="quiz-start-box">
        <h2>🎯 選擇測驗模式</h2>
        <div class="quiz-type-selector">
          <div class="type-card selected" onclick="selectQuizType('choice_en_zh', this)">
            <h3>🔠 英譯中</h3>
          </div>
          <div class="type-card" onclick="selectQuizType('choice_zh_en', this)">
            <h3>🔠 中譯英</h3>
          </div>
          <div class="type-card" onclick="selectQuizType('spelling', this)">
            <h3>✍️ 拼字填空</h3>
          </div>
        </div>
        <button class="btn" style="padding: 0.8rem 2.5rem;" onclick="startQuiz()">開始測驗</button>
      </div>

      <div class="card quiz-container hidden" id="quiz-running-box">
        <div style="text-align: right; color: var(--text-muted);" id="quiz-progress">題號 1 / 5</div>
        <div style="font-size: 2.2rem; font-weight: 700; margin: 1.5rem 0;" id="quiz-question-display">Word</div>
        <div id="quiz-sub-prompt" style="color: var(--text-muted); margin-bottom: 1rem;"></div>

        <div class="options-grid" id="quiz-options-container"></div>

        <div id="quiz-input-container" class="hidden">
          <input type="text" id="quiz-type-input" placeholder="請輸入對應的英文單字..." style="max-width: 400px; text-align: center; margin-bottom: 1rem;">
          <br>
          <button class="btn" onclick="submitInputAnswer()">提交答案</button>
        </div>
      </div>

      <div class="card hidden" id="quiz-result-box">
        <h2>📊 測驗結算與考後反省</h2>
        <p id="quiz-score-summary" style="font-size: 1.1rem; font-weight: 600;"></p>
        <div id="wrong-words-container"></div>
        <br>
        <button class="btn" onclick="startQuiz()">再測一次</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbymWm19Bgr_tpmWK7xAPDBVdnAchzG7auaIp6CREpF7OhGW2Cm36op31p0qN_6ArQYKg/exec";

    let currentUser = "";
    let vocabData = [];
    let currentQuizType = "choice_en_zh";
    let currentQuizIndex = 0;
    let currentQuizQuestions = [];
    let wrongAnswers = [];

    async function login() {
      const username = document.getElementById("username-input").value.trim();
      if (!username) return alert("請輸入使用者名稱！");
      currentUser = username;
      document.getElementById("current-user-display").innerText = `👤 ${currentUser}`;
      document.getElementById("auth-section").classList.add("hidden");
      document.getElementById("app-nav").classList.remove("hidden");
      
      await loadUserDataFromCloud();
      switchTab('list');
    }

    function logout() {
      currentUser = "";
      vocabData = [];
      document.getElementById("auth-section").classList.remove("hidden");
      document.getElementById("app-nav").classList.add("hidden");
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
    }

    async function loadUserDataFromCloud() {
      setSyncStatus("☁️ 正在連線雲端資料庫...");
      try {
        const res = await fetch(`${GAS_API_URL}?user=${encodeURIComponent(currentUser)}`);
        const cloudData = await res.json();
        vocabData = cloudData || [];
        setSyncStatus("✅ 雲端資料已同步");
      } catch (err) {
        console.error(err);
        setSyncStatus("⚠️ 連線失敗，使用本機快取");
        const local = localStorage.getItem(`vocab_data_${currentUser}`);
        vocabData = local ? JSON.parse(local) : [];
      }
      renderWordList();
    }

    async function saveUserDataToCloud() {
      localStorage.setItem(`vocab_data_${currentUser}`, JSON.stringify(vocabData));
      setSyncStatus("☁️ 正在同步到雲端...");
      try {
        await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "saveAll", user: currentUser, data: vocabData })
        });
        setSyncStatus("✅ 已同步至雲端試算表");
      } catch (err) {
        console.error(err);
        setSyncStatus("⚠️ 雲端同步失敗");
      }
    }

    function setSyncStatus(msg) {
      document.getElementById("sync-indicator").innerText = msg;
    }

    function switchTab(tabName) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
      document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));
      
      if (tabName === 'list') {
        document.getElementById("list-tab").classList.remove("hidden");
        if(window.event && window.event.target) window.event.target.classList.add("active");
        renderWordList();
      } else if (tabName === 'add') {
        document.getElementById("add-tab").classList.remove("hidden");
        if(window.event && window.event.target) window.event.target.classList.add("active");
      } else if (tabName === 'quiz') {
        document.getElementById("quiz-tab").classList.remove("hidden");
        if(window.event && window.event.target) window.event.target.classList.add("active");
        resetQuizUI();
      }
    }

// ⚡ 超細分狀態的自動帶入功能（精準定位卡在哪裡）
async function autoFetchDetails() {
  const word = document.getElementById("word-spelling").value.trim().toLowerCase();
  const msg = document.getElementById("auto-fetch-msg");
  
  if (!word) {
    alert("請先輸入英文單字！");
    return;
  }

  // 重置顯示狀態
  msg.style.color = "var(--primary)";
  msg.innerText = "⏳ [1/3] 正在準備發送 API 請求...";

  try {
    // 步驟 1: 抓取中文翻譯 (MyMemory API)
    msg.innerText = "⏳ [2/3] 正在請求中文翻譯 API...";
    let transRes;
    try {
      transRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-TW`);
    } catch (networkErr) {
      throw new Error("翻譯 API 被瀏覽器攔截 (CORS 或網路被擋)");
    }

    if (!transRes.ok) {
      throw new Error(`翻譯 API 回應異常 (HTTP 狀態碼: ${transRes.status})`);
    }

    const transData = await transRes.json();
    if (transData && transData.responseData && transData.responseData.translatedText) {
      document.getElementById("word-meaning").value = transData.responseData.translatedText;
    } else {
      console.warn("翻譯 API 未回傳有效文字");
    }

    // 步驟 2: 抓取詞性與例句 (Dictionary API)
    msg.innerText = "⏳ [3/3] 正在請求英文字典 API (詞性/例句)...";
    let dictRes;
    try {
      dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
    } catch (networkErr) {
      throw new Error("字典 API 被瀏覽器攔截 (CORS 或網路被擋)");
    }

    if (dictRes.status === 404) {
      // 404 代表字典查無此字，但翻譯可能已經成功
      msg.style.color = "var(--warning)";
      msg.innerText = "⚠️ 翻譯已帶入，但字典 API 查無此字的詞性與例句 (404)";
      return;
    } else if (!dictRes.ok) {
      throw new Error(`字典 API 回應異常 (HTTP 狀態碼: ${dictRes.status})`);
    }

    const dictData = await dictRes.json();
    if (Array.isArray(dictData) && dictData[0] && dictData[0].meanings) {
      const firstMeaning = dictData[0].meanings[0];
      
      // 自動比對並選擇詞性
      const pos = firstMeaning.partOfSpeech || "";
      const selectPos = document.getElementById("word-pos");
      if (pos.includes("noun")) selectPos.value = "n.";
      else if (pos.includes("verb")) selectPos.value = "v.";
      else if (pos.includes("adjective")) selectPos.value = "adj.";
      else if (pos.includes("adverb")) selectPos.value = "adv.";
      else if (pos.includes("preposition")) selectPos.value = "prep.";
      else if (pos.includes("conjunction")) selectPos.value = "conj.";

      // 自動尋找含有例句的解釋
      if (firstMeaning.definitions) {
        const defWithEx = firstMeaning.definitions.find(d => d.example);
        if (defWithEx) {
          document.getElementById("word-sentence").value = defWithEx.example;
        }
      }
    }

    // 全部成功完成
    msg.style.color = "var(--success)";
    msg.innerText = "✅ [完成] 釋義、詞性與例句已成功自動帶入！";

  } catch (err) {
    // 捕捉所有細分錯誤並顯示在畫面上
    console.error("詳細錯誤記錄:", err);
    msg.style.color = "var(--danger)";
    msg.innerText = `❌ 出錯階段：${err.message}`;
  }
}


    // 🔍 開啟劍橋字典
    function lookupDictionary(word) {
      window.open(`https://dictionary.cambridge.org/zht/dictionary/english-chinese-traditional/${encodeURIComponent(word.toLowerCase())}`, '_blank');
    }

    function renderWordList() {
      const container = document.getElementById("word-list");
      const keyword = document.getElementById("search-input").value.toLowerCase();
      const filter = document.getElementById("filter-select").value;

      container.innerHTML = "";
      let filtered = vocabData.filter(item => {
        const matchesKey = item.word.toLowerCase().includes(keyword) || item.meaning.includes(keyword);
        const matchesFilter = filter === 'all' || (filter === 'error' && item.isError);
        return matchesKey && matchesFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; color: var(--text-muted);">尚無單字資料。</p>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = `word-card ${item.isError ? 'error-marked' : ''}`;
        card.innerHTML = `
          <div style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.3rem;">
            ${item.word} ${item.isError ? '<span class="badge badge-error">易錯</span>' : ''}
          </div>
          <div style="margin-bottom: 0.5rem;">
            <span class="badge badge-pos">${item.pos}</span>
            <span style="font-weight: 500;">${item.meaning}</span>
          </div>
          ${item.sentence ? `<p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.8rem;">💬 ${item.sentence}</p>` : ''}
          <div style="margin-top: 1rem; display: flex; gap: 0.3rem; flex-wrap: wrap;">
            <button class="btn btn-secondary" style="padding: 0.3rem 0.5rem; font-size: 0.8rem;" onclick="lookupDictionary('${item.word}')">🔍 字典</button>
            <button class="btn btn-secondary" style="padding: 0.3rem 0.5rem; font-size: 0.8rem;" onclick="toggleError('${item.id}')">
              ${item.isError ? '取消易錯' : '標註易錯'}
            </button>
            <button class="btn btn-danger" style="padding: 0.3rem 0.5rem; font-size: 0.8rem; margin-left: auto;" onclick="deleteWord('${item.id}')">刪除</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function addWord(e) {
      e.preventDefault();
      const spelling = document.getElementById("word-spelling").value.trim();
      const pos = document.getElementById("word-pos").value;
      const meaning = document.getElementById("word-meaning").value.trim();
      const sentence = document.getElementById("word-sentence").value.trim();

      vocabData.push({ id: Date.now().toString(), word: spelling, pos, meaning, sentence, isError: false });
      renderWordList();
      await saveUserDataToCloud();
      alert("單字成功儲存並同步至雲端！");
      document.getElementById("add-word-form").reset();
      document.getElementById("auto-fetch-msg").innerText = "";
      switchTab('list');
    }

    async function deleteWord(id) {
      if (confirm("確定要刪除此單字？")) {
        vocabData = vocabData.filter(i => String(i.id) !== String(id));
        renderWordList();
        await saveUserDataToCloud();
      }
    }

    async function toggleError(id) {
      const item = vocabData.find(i => String(i.id) === String(id));
      if (item) {
        item.isError = !item.isError;
        renderWordList();
        await saveUserDataToCloud();
      }
    }

    function selectQuizType(type, el) {
      currentQuizType = type;
      document.querySelectorAll(".type-card").forEach(c => c.classList.remove("selected"));
      el.classList.add("selected");
    }

    function resetQuizUI() {
      document.getElementById("quiz-start-box").classList.remove("hidden");
      document.getElementById("quiz-running-box").classList.add("hidden");
      document.getElementById("quiz-result-box").classList.add("hidden");
    }

    function startQuiz() {
      if (vocabData.length < 2) return alert("單字庫至少需要有 2 個單字才能開始測驗！");
      currentQuizQuestions = [...vocabData].sort(() => 0.5 - Math.random()).slice(0, 5);
      currentQuizIndex = 0;
      wrongAnswers = [];

      document.getElementById("quiz-start-box").classList.add("hidden");
      document.getElementById("quiz-result-box").classList.add("hidden");
      document.getElementById("quiz-running-box").classList.remove("hidden");
      showNextQuestion();
    }

    function showNextQuestion() {
      if (currentQuizIndex >= currentQuizQuestions.length) return finishQuiz();

      const q = currentQuizQuestions[currentQuizIndex];
      document.getElementById("quiz-progress").innerText = `題號 ${currentQuizIndex + 1} / ${currentQuizQuestions.length}`;
      
      const optionsContainer = document.getElementById("quiz-options-container");
      const inputContainer = document.getElementById("quiz-input-container");
      optionsContainer.classList.add("hidden");
      inputContainer.classList.add("hidden");

      if (currentQuizType === 'choice_en_zh') {
        document.getElementById("quiz-question-display").innerText = q.word;
        document.getElementById("quiz-sub-prompt").innerText = `請選擇正確中文（詞性：${q.pos}）`;
        optionsContainer.classList.remove("hidden");
        renderOptions(q, 'meaning');
      } else if (currentQuizType === 'choice_zh_en') {
        document.getElementById("quiz-question-display").innerText = `${q.pos} ${q.meaning}`;
        document.getElementById("quiz-sub-prompt").innerText = "請選擇正確英文單字";
        optionsContainer.classList.remove("hidden");
        renderOptions(q, 'word');
      } else if (currentQuizType === 'spelling') {
        document.getElementById("quiz-question-display").innerText = `${q.pos} ${q.meaning}`;
        document.getElementById("quiz-sub-prompt").innerText = `請拼寫英文單字 (首字母: ${q.word[0]})`;
        inputContainer.classList.remove("hidden");
        document.getElementById("quiz-type-input").value = "";
        document.getElementById("quiz-type-input").focus();
      }
    }

    function renderOptions(q, key) {
      let options = [q];
      let others = vocabData.filter(i => String(i.id) !== String(q.id)).sort(() => 0.5 - Math.random());
      while (options.length < Math.min(4, vocabData.length)) options.push(others.pop());
      options.sort(() => 0.5 - Math.random());

      const container = document.getElementById("quiz-options-container");
      container.innerHTML = "";
      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt[key];
        btn.onclick = () => checkAnswer(String(opt.id) === String(q.id), q);
        container.appendChild(btn);
      });
    }

    function submitInputAnswer() {
      const userInput = document.getElementById("quiz-type-input").value.trim().toLowerCase();
      const q = currentQuizQuestions[currentQuizIndex];
      checkAnswer(userInput === q.word.toLowerCase(), q);
    }

    async function checkAnswer(isCorrect, questionObj) {
      if (!isCorrect) {
        const item = vocabData.find(i => String(i.id) === String(questionObj.id));
        if (item) item.isError = true;
        wrongAnswers.push(questionObj);
        await saveUserDataToCloud();
      }
      currentQuizIndex++;
      showNextQuestion();
    }

    function finishQuiz() {
      document.getElementById("quiz-running-box").classList.add("hidden");
      document.getElementById("quiz-result-box").classList.remove("hidden");

      const total = currentQuizQuestions.length;
      const correct = total - wrongAnswers.length;
      document.getElementById("quiz-score-summary").innerText = `🎯 得分：${correct} / ${total} (正確率: ${Math.round(correct/total * 100)}%)`;

      const wrongContainer = document.getElementById("wrong-words-container");
      wrongContainer.innerHTML = "";
      if (wrongAnswers.length === 0) {
        wrongContainer.innerHTML = "<p style='color: var(--success); font-weight: 600;'>🎉 太棒了，本次測驗全對！</p>";
      } else {
        wrongAnswers.forEach(item => {
          const div = document.createElement("div");
          div.style.cssText = "padding: 0.8rem; border-bottom: 1px solid var(--border);";
          div.innerHTML = `<strong style="color: var(--danger);">${item.word}</strong> (${item.pos}) ${item.meaning}`;
          wrongContainer.appendChild(div);
        });
      }
    }
  </script>
</body>
</html>
